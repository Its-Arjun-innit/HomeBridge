<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HomeBridge Care Services</title>
    <!--
      GitHub Pages has no server-side rewrite, so a direct visit to /services
      hits this 404 page instead of the app. This redirects to the root with the
      path preserved in the query string; the snippet in index.html restores it
      before React boots, so the visitor lands on /services with a 200. Standard
      spa-github-pages technique (rafgraph). pathSegmentsToKeep = 0 because the
      site is served at the domain root.
    -->
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
