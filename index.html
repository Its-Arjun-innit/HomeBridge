<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- GitHub Pages sends no security headers and offers no way to add them,
         so this is the only lever available. Note: frame-ancestors, HSTS,
         X-Frame-Options and X-Content-Type-Options are response-header-only and
         are NOT achievable on this host — see the security notes in README.md.
         style-src needs 'unsafe-inline' because the pages use React inline
         style={{...}} attributes. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               script-src 'self';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' https://fonts.gstatic.com;
               img-src 'self' data:;
               media-src 'self';
               connect-src 'self' https://api.web3forms.com;
               form-action 'self';
               upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>HomeBridge Home Care Services — Compassionate In-Home Care</title>
    <meta
      name="description"
      content="HomeBridge Home Care Services provides compassionate, personalized in-home care for seniors and individuals needing daily-living support — helping them stay safe, comfortable, and independent at home."
    />
    <meta property="og:title" content="HomeBridge Home Care Services" />
    <meta
      property="og:description"
      content="Bridging care, comfort, and independence at home."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/media/hero.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Restores the real path after the 404.html redirect. Must run before the
         bundle so React Router reads the corrected URL. External (not inline) so
         the CSP can stay on script-src 'self'. -->
    <script src="/spa-restore.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
