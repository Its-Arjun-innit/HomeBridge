version: 2
updates:
  # npm packages. Security advisories are raised regardless of schedule;
  # this also keeps routine versions moving so upgrades stay small.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the build toolchain rather than four — these move together.
      dev-tooling:
        dependency-type: development

  # The deploy workflow's actions need updating too; stale actions are a real
  # supply-chain surface.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
